name: Release Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mc-scheduler-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: mc-scheduler-app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: mc-scheduler-app
        run: npm ci

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set on this repository."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set on this repository."
          }

      - name: Build the signed NSIS installer
        working-directory: mc-scheduler-app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # GitHub secret boxes often keep a trailing newline from a pasted file.
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD.Trim()
          npm run tauri -- build

      - name: Write latest.json
        working-directory: mc-scheduler-app
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_NOTES: |
            In-app updates are available starting with this version.
            When an update is offered, back up the full database before installing.
            Versions before 0.1.0 do not contain the updater and must be installed by hand.
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          node --experimental-strip-types scripts/writeLatestJson.ts `
            --nsis-dir src-tauri/target/release/bundle/nsis `
            --stage src-tauri/target/release/bundle/nsis/upload `
            --repo flakvest/MC-Scheduler `
            --tag $env:RELEASE_TAG `
            --version $version `
            --notes $env:RELEASE_NOTES

      - name: Publish the installer and updater manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: MC Scheduler ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            In-app updates are available starting with this version.
            When an update is offered, back up the full database before installing.
            Versions before 0.1.0 do not contain the updater and must be installed by hand.
            Windows SmartScreen may warn until the setup is code-signed. The updater signature is separate from Windows code signing.
          files: mc-scheduler-app/src-tauri/target/release/bundle/nsis/upload/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
